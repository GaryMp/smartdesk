# Entorno de DESARROLLO LOCAL de SmartDesk: PostgreSQL + n8n.
#
# El backend NestJS se ejecuta en la máquina anfitriona (npm run start:dev) y
# se conecta a estos servicios a través de los puertos publicados en 127.0.0.1.
# Esta configuración no está pensada para producción: no hay TLS, ni copias de
# seguridad, ni gestión de secretos más allá del archivo .env local.
#
# Uso: cp .env.example .env  →  edita los valores  →  docker compose up -d

name: smartdesk

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartdesk}
    ports:
      # Solo accesible desde la máquina local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir de PostgreSQL 18 la imagen oficial guarda los datos en
      # /var/lib/postgresql/<versión>/docker, por eso se monta el directorio padre.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.44.5
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # URL base que n8n muestra en los nodos Webhook. Es una variable del
      # contenedor de n8n (en n8n 2.x sustituye a WEBHOOK_URL, ya obsoleta);
      # no confundir con N8N_WEBHOOK_URL de backend/.env, que es la URL completa.
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      # Base de datos SQLite de n8n, clave de cifrado y credenciales cifradas.
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  n8n_data:
